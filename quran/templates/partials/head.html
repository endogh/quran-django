{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>{{ seo_title|default:"Quran Kareem — Al-Qur'an Online 30 Juz & 114 Surah" }}</title>
   <meta name="description" content="{{ seo_description|default:"Baca Al-Qur'an online 30 juz lengkap 114 surah dengan teks Arab, transliterasi, dan terjemahan bahasa Indonesia." }}">
   <meta name="keywords" content="{{ seo_keywords|default:'quran online, al-quran, baca quran, terjemahan quran, quran 30 juz, surah, ayat' }}">
   <meta name="robots" content="{{ seo_robots|default:'index, follow' }}">
   <meta name="googlebot" content="{{ seo_robots|default:'index, follow' }}">
   <meta name="author" content="Rudian">
   <meta name="language" content="id">
   <meta name="theme-color" content="#10b981">

   {% if canonical_url %}<link rel="canonical" href="{{ canonical_url }}">{% endif %}
   <link rel="alternate" hreflang="id" href="{{ canonical_url|default:request.build_absolute_uri }}">
   <link rel="alternate" hreflang="x-default" href="{{ canonical_url|default:request.build_absolute_uri }}">

   <!-- Open Graph (Facebook, WhatsApp, dll.) -->
   <meta property="og:site_name" content="Quran Kareem">
   <meta property="og:type" content="{{ seo_type|default:'website' }}">
   <meta property="og:title" content="{{ seo_title|default:"Quran Kareem — Al-Qur'an Online" }}">
   <meta property="og:description" content="{{ seo_description|default:"Baca Al-Qur'an online 30 juz lengkap 114 surah dengan teks Arab, transliterasi, dan terjemahan bahasa Indonesia." }}">
   <meta property="og:url" content="{{ canonical_url|default:request.build_absolute_uri }}">
   <meta property="og:image" content="{% if seo_image %}{{ seo_image }}{% else %}{{ request.scheme }}://{{ request.get_host }}{% static 'images/logoquran.png' %}{% endif %}">
   <meta property="og:locale" content="id_ID">

   <!-- Twitter Card -->
   <meta name="twitter:card" content="summary_large_image">
   <meta name="twitter:title" content="{{ seo_title|default:"Quran Kareem — Al-Qur'an Online" }}">
   <meta name="twitter:description" content="{{ seo_description|default:"Baca Al-Qur'an online 30 juz lengkap 114 surah." }}">
   <meta name="twitter:image" content="{% if seo_image %}{{ seo_image }}{% else %}{{ request.scheme }}://{{ request.get_host }}{% static 'images/logoquran.png' %}{% endif %}">

   <!-- Geo -->
   <meta name="geo.region" content="ID">
   <meta name="geo.placename" content="Indonesia">

   <link href="{% static 'favicon.ico' %}" rel="icon">

   {% if json_ld %}
   <script type="application/ld+json">{{ json_ld|safe }}</script>
   {% endif %}

   <!-- Fonts & ikon -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700;800&family=Scheherazade+New:wght@400;700&family=Lateef:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   <script src="https://cdn.tailwindcss.com"></script>
   <script>
      tailwind.config = {
         darkMode: 'class',
         theme: {
            extend: {
               fontFamily: {
                  arabic: ['Amiri', 'serif'],
                  sans: ['Inter', 'sans-serif'],
               },
               colors: {
                  primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
                  emerald: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' },
               }
            }
         }
      }
   </script>
   <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
</head>
